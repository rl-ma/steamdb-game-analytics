[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["*.ipynb", ".venv", "venv", "mlruns", "mlartifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: end-to-end tests requiring Docker Compose services",
]
